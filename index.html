<!DOCTYPE html><html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeGrow - AI 주식 앱</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f6f3;
      color: #183328;
    }
    header {
      background: #174b35;
      color: white;
      padding: 24px 20px;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #d8eee0; }
    main { max-width: 600px; margin: auto; padding: 18px; }
    .notice, .card {
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 14px;
      background: white;
    }
    .notice {
      background: #fff3d3;
      line-height: 1.6;
      font-size: 14px;
    }
    .card { box-shadow: 0 2px 8px #0000000a; }
    .card h2 { font-size: 18px; margin-top: 0; }
    .item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid #e8eee9;
    }
    .item:last-child { border-bottom: 0; }
    .muted { color: #6b7770; }
    .status { color: #197447; font-weight: bold; }
    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #dfe5e1;
      color: #47534c;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #68766d;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌱 SafeGrow</h1>
    <p>초보자를 위한 AI 주식 분석 도구</p>
  </header>  <main>
    <div class="notice">
      <strong>🔒 안전 모드</strong><br>
      현재는 첫 화면 테스트 단계입니다.
      실제 계좌 연결 및 주식 주문은 비활성화되어 있습니다.
    </div><section class="card">
  <h2>💰 내 투자 현황</h2>
  <div class="item">
    <span class="muted">시작 투자금</span>
    <strong>500,000원</strong>
  </div>
  <div class="item">
    <span class="muted">현재 평가금액</span>
    <strong>조회 전</strong>
  </div>
  <div class="item">
    <span class="muted">오늘 손익</span>
    <strong>계산 전</strong>
  </div>
</section>

<section class="card">
  <h2>🤖 자동매매 상태</h2>
  <p class="status">● 모의매매 준비 중</p>
  <p class="muted">아직 시세 API에 연결되지 않았습니다.</p>
  <button type="button" disabled>실제 주문 기능 · 비활성화</button>
</section>

<section class="card">
  <h2>📋 개발 진행 상황</h2>
  <div class="item"><span>시세 조회</span><span>대기</span></div>
  <div class="item"><span>매매 규칙</span><span>대기</span></div>
  <div class="item"><span>모의매매</span><span>대기</span></div>
  <div class="item"><span>위험관리 테스트</span><span>대기</span></div>
</section>

  </main>  <footer>
    SafeGrow · 학습 및 테스트용<br>
    주식 투자에는 원금 손실 위험이 있습니다.
  </footer>
</body>
</html>
